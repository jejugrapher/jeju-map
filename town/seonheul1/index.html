function pinSVG(p){
 const c=CATS[p.cat].color, x=X(p.lng), y=Y(p.lat);
 const label=trName(p.name);
 let wdt=22; for(const ch of label){ wdt += (ch.charCodeAt(0)<256?9.8:15.8); }
 let lx=x, ly=y, anchor='middle';
 if(p.la==='right'){lx=x+20;ly=y-2;anchor='start'}
 else if(p.la==='left'){lx=x-20;ly=y-2;anchor='end'}
 else if(p.la==='top'){lx=x;ly=y-34}
 else {lx=x;ly=y+34}
 lx+=(p.dx||0); ly+=(p.dy||0);
 const rectX=anchor==='start'?lx-8:anchor==='end'?lx-wdt+8:lx-wdt/2;
 return `<g class="pin-g" data-name="${p.name}">
   <path d="M${x} ${y} m0 -26 c-11 0 -17 8 -17 16 c0 11 17 28 17 28 c0 0 17 -17 17 -28 c0 -8 -6 -16 -17 -16 Z" fill="${c}" stroke="#fffdf4" stroke-width="3"/>
   <circle cx="${x}" cy="${y-11}" r="5.5" fill="#fffdf4"/>
   <g class="pin-label">
     <rect x="${rectX}" y="${ly-15}" rx="10" width="${wdt}" height="26" fill="#fffdf4" stroke="${c}" stroke-width="2"/>
     <text x="${lx}" y="${ly+4}" text-anchor="${anchor==='start'?'start':anchor==='end'?'end':'middle'}" font-family="Gaegu" font-weight="700" font-size="17" fill="#54463a">${anchor==='start'?' ':''}${label}</text>
   </g></g>`;
}
function render(){
 let s=decorations();
 SPOTS.filter(p=>state[p.cat]).forEach(p=>{s+=pinSVG(p)});
 svg.innerHTML=s;
 svg.querySelectorAll('.pin-g').forEach(g=>{
   g.addEventListener('click',()=>{
     const p=SPOTS.find(q=>q.name===g.dataset.name);
     openDetail(p);
   });
 });
}
function openDetail(p){
 const d=document.getElementById('detail');
 const u=UI[LANG];
 const vb=p.verify==='osm'?`<span class="badge">${u.osm}</span>`:p.verify==='gdr'?`<span class="badge">${u.gdr}</span>`:`<span class="badge warn">${u.approx}</span>`;
 const mb=p.memorial?`<span class="badge memorial">${u.memorial}</span>`:'';
 d.innerHTML=`<button class="close" onclick="this.parentElement.style.display='none'">✕</button>
  <h2>${trName(p.name)}</h2>
  <div><span class="cat" style="background:${CATS[p.cat].color}">${u.cats[p.cat]}</span>${vb}${mb}</div>
  <dt>${u.story}</dt><dd>${trDesc(p)}</dd>
  ${p.info?`<dt>${u.info}</dt><dd>${p.info}</dd>`:''}
  ${p.splatUrl?`<a class="splat-btn" style="display:block;text-align:center;margin-top:12px;padding:9px;border-radius:12px;background:#5a7fb5;color:#fff;text-decoration:none;font-size:13px" href="${p.splatUrl}" target="_blank">▶ 3D 가우시안 스플래팅 뷰</a>`:''}
  ${p.youtube?`<div style="margin-top:12px;position:relative;padding-top:56%;border-radius:12px;overflow:hidden"><iframe style="position:absolute;inset:0;width:100%;height:100%;border:0" src="https://www.youtube-nocookie.com/embed/${p.youtube}?rel=0${p.youtubeStart?'&start='+Math.floor(p.youtubeStart):''}" allowfullscreen loading="lazy"></iframe></div>`:''}
  <div class="src">${UI[LANG].src}: ${p.src}</div>`;
 d.style.display='block';
}
const chips=document.getElementById('chips');
Object.entries(CATS).forEach(([k,c])=>{
 const el=document.createElement('div');
 el.className='chip';el.textContent=c.label;el.style.borderColor=c.color;el.style.color=c.color;
 el.onclick=()=>{state[k]=!state[k];el.classList.toggle('off');render();};
 chips.appendChild(el);
});
render();
</script>
</body>
</html>
